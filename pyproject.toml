[project]
name = "sam-tracker"
version = "0.1.0"
description = "Track amendments to SAM.gov solicitations: snapshot, diff, report."
requires-python = ">=3.11"
dependencies = ["requests>=2.31", "sqlalchemy>=2.0", "pypdf>=4.0", "python-docx>=1.1"]

[project.optional-dependencies]
llm = ["anthropic>=1.0"]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8"]

[project.scripts]
sam-tracker = "sam_tracker.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sam_tracker*"]
